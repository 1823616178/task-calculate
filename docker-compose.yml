services:
  app:
    build: .
    container_name: task-calculate-app
    restart: unless-stopped
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-48980}
      # MySQL / EMQX 均运行在宿主机，容器统一经 host.docker.internal 访问；
      # 不复用 .env 的 DB_HOST / MQTT_URL：其中的 127.0.0.1 或局域网 IP 在容器内不可靠
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-task_calculate}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MQTT_URL: ${DOCKER_MQTT_URL:-mqtt://host.docker.internal:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-48980}:${PORT:-48980}"
